[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbdraft"
version = "1.1.0.dev0"
description = "PCBDraft: local agent-safe PCB planning and KiCad runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "PCBDraft contributors"}]
keywords = ["pcb", "kicad", "eda", "agent", "electronics", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    # Pinned because generated KiCad syntax is part of the output contract.
    "defusedxml==0.7.1",
    "jsonschema==4.26.0",
    "kicad-sch-api==0.5.6",
    "textual>=8.2.8,<9",
]

[project.urls]
Homepage = "https://github.com/qixuancao/pcbdraft"
Repository = "https://github.com/qixuancao/pcbdraft.git"
Issues = "https://github.com/qixuancao/pcbdraft/issues"
Changelog = "https://github.com/qixuancao/pcbdraft/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "coverage[toml]==7.15.4",
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "ruff==0.16.2",
]

[project.scripts]
pcbdraft = "pcbdraft.interfaces.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pcbdraft*"]
exclude = ["copperwright*"]

[tool.setuptools.package-data]
pcbdraft = ["data/**/*.json", "data/**/*.md", "data/**/*.yml", "interfaces/tui/*.tcss", "web/*.html", "web/*.css", "web/*.js", "web/*.png"]

[tool.ruff.lint]
extend-select = ["B", "C90", "S"]

[tool.ruff.lint.mccabe]
max-complexity = 46

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S104", "S108", "S310", "S603"]

[tool.coverage.run]
branch = true
source = ["pcbdraft"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
files = [
    "src/pcbdraft/core/errors.py",
    "src/pcbdraft/core/io.py",
    "src/pcbdraft/core/locking.py",
    "src/pcbdraft/core/project.py",
    "src/pcbdraft/model/api.py",
    "src/pcbdraft/model/config.py",
    "src/pcbdraft/services/jobs.py",
    "src/pcbdraft/verification/evidence.py",
]
