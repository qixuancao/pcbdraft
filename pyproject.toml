[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-agent-runtime"
version = "0.1.0"
description = "Evidence-driven KiCad AI reviewer and transactional safe patcher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pcb-agent = "pcb_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

