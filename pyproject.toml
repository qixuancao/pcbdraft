[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbdraft"
version = "0.1.0"
description = "PCBDraft: local agent-safe PCB planning and KiCad runtime"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "PCBDraft contributors"}]
keywords = ["pcb", "kicad", "eda", "agent", "electronics", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    # PCBDraft core: pinned because generated KiCad syntax is part of the output contract.
    "defusedxml==0.7.1",
    "jsonschema==4.26.0",
    "kicad-sch-api==0.5.6",
    "textual>=8.2.8,<9",
    # Hermes Agent runtime (vendored under vendor/hermes). Exact pins follow the
    # upstream hermes-agent base dependency set so the agent loop and tool
    # system resolve identically to upstream.
    "openai==2.24.0",
    "certifi==2026.5.20",
    "python-dotenv==1.2.2",
    "fire==0.7.1",
    "httpx[socks]==0.28.1",
    "rich==14.3.3",
    "tenacity==9.1.4",
    "pyyaml==6.0.3",
    "ruamel.yaml==0.18.17",
    "requests==2.33.0",
    "jinja2==3.1.6",
    "pydantic==2.13.4",
    "prompt_toolkit==3.0.52",
    "croniter==6.0.0",
    "packaging==26.0",
    "Markdown==3.10.2",
    "PyJWT[crypto]==2.13.0",
    "urllib3>=2.7.0,<3",
    "cryptography==50.0.0",
    "psutil==7.2.2",
    "websockets==15.0.1",
    "pathspec==1.1.1",
    "fastapi>=0.104.0,<1",
    "uvicorn[standard]>=0.24.0,<1",
    "python-multipart>=0.0.9,<1",
    "ptyprocess>=0.7.0,<1",
    "Pillow==12.3.0",
]

[project.urls]
Homepage = "https://github.com/qixuancao/pcbdraft"
Repository = "https://github.com/qixuancao/pcbdraft.git"
Issues = "https://github.com/qixuancao/pcbdraft/issues"
Changelog = "https://github.com/qixuancao/pcbdraft/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "coverage[toml]==7.15.4",
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "ruff==0.16.2",
]

[project.scripts]
pcbdraft = "pcbdraft.interfaces.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pcbdraft*"]
exclude = ["copperwright*"]

[tool.setuptools.package-data]
pcbdraft = ["data/**/*.json", "data/**/*.md", "data/**/*.yml", "interfaces/tui/*.tcss"]

[tool.ruff.lint]
extend-select = ["B", "C90", "S"]

[tool.ruff.lint.mccabe]
max-complexity = 46

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S104", "S108", "S310", "S603"]

[tool.coverage.run]
branch = true
source = ["pcbdraft"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
files = ["src/pcbdraft"]
