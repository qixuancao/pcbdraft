[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbdraft"
version = "1.0.0"
description = "PCBDraft: local agent-safe PCB planning and KiCad runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "PCBDraft contributors"}]
keywords = ["pcb", "kicad", "eda", "agent", "electronics", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    # Pinned because generated KiCad syntax is part of the output contract.
    "kicad-sch-api==0.5.6",
    "textual>=8.2.8,<9",
]

[project.urls]
Homepage = "https://github.com/qixuancao/pcbdraft"
Repository = "https://github.com/qixuancao/pcbdraft.git"
Issues = "https://github.com/qixuancao/pcbdraft/issues"
Changelog = "https://github.com/qixuancao/pcbdraft/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.12"]

[project.scripts]
pcbdraft = "pcbdraft.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pcbdraft = ["data/**/*.json", "data/**/*.md", "data/**/*.yml", "*.tcss", "web/*.html", "web/*.css", "web/*.js", "web/*.png"]
