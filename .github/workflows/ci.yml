name: PCBDraft CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-core:
    name: Python ${{ matrix.python }} core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install official KiCad 10 toolchain and libraries
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad kicad-libraries
          [[ "$(kicad-cli --version)" =~ ^10\.0\.[0-9]+$ ]]
      - name: Initialize KiCad user library tables
        run: scripts/prepare-kicad-environment.sh
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # The runtime constraints are compared byte-for-byte below. Pin the
          # exporter too: uv's harmless dependency annotations can vary by release.
          version: "0.12.1"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run coverage run -m unittest discover -s tests -v
      - run: uv run coverage report
      - run: uv run python -m compileall -q src tests

  kicad-acceptance:
    name: KiCad 10 release acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # Keep the export syntax and its annotations stable for the exact
          # constraints/runtime.txt comparison in this job.
          version: "0.12.1"
          python-version: "3.11"
          enable-cache: true
      - name: Install official KiCad 10 packages
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad kicad-libraries
          [[ "$(kicad-cli --version)" =~ ^10\.0\.[0-9]+$ ]]
      - name: Initialize KiCad user library tables
        run: scripts/prepare-kicad-environment.sh
      - run: uv sync --frozen --extra dev
      - name: Verify locked dependency export
        run: |
          uv export --frozen --no-dev --no-emit-project --no-header --format requirements-txt --output-file "$RUNNER_TEMP/runtime.txt"
          diff --unified constraints/runtime.txt "$RUNNER_TEMP/runtime.txt"
      - name: Audit locked runtime dependencies
        run: uv run pip-audit --strict --require-hashes --disable-pip --progress-spinner=off -r constraints/runtime.txt
      - name: Audit locked build dependency
        run: uv run pip-audit --strict --require-hashes --disable-pip --progress-spinner=off -r constraints/build.txt
      - run: scripts/release-check.sh
