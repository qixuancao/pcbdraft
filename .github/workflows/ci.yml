name: PCBDraft CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deepseek-contract:
    name: Optional DeepSeek Harness contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen --extra dev --extra harness
      - run: uv run ruff check src/pcbdraft/harness_bridge.py src/pcbdraft/deepseek_bridge.py tests/test_harness_provider.py integrations/deepseek-harness/test/python-provider-runtime.py
      - run: uv run python -m unittest -v tests.test_harness_provider
      - run: uv run python integrations/deepseek-harness/test/python-provider-runtime.py
      - run: node --test integrations/deepseek-harness/test/plugin.test.mjs

  python-core:
    name: Python ${{ matrix.python }} core
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install official KiCad 10 toolchain and libraries
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes kicad
      - name: Initialize KiCad user library tables
        run: scripts/prepare-kicad-environment.sh
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python -m compileall -q src tests

  kicad-acceptance:
    name: KiCad 10 release acceptance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install official KiCad 10 packages
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes kicad
      - name: Initialize KiCad user library tables
        run: scripts/prepare-kicad-environment.sh
      - run: scripts/release-check.sh
