name: PCBDraft platform acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installer-contract:
    name: ${{ matrix.os }} installer contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: false
      - name: Validate Bash installer syntax
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n scripts/install.sh
      - name: Validate PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/install.ps1"), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Validate Windows PowerShell 5.1 compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/install.ps1"), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Run non-mutating installer decision tests
        run: >-
          uv run --no-project --python 3.12 python -m unittest -v
          tests.core.test_installers

  portable-core:
    name: ${{ matrix.os }} package and core
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pcbdraft --help
      - name: Validate Unix installer syntax
        if: runner.os == 'macOS'
        run: bash -n scripts/install.sh scripts/prepare-kicad-environment.sh
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/install.ps1"), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Run cross-platform boundaries
        run: >-
          uv run python -m unittest -v
          tests.kicad.test_support
          tests.kicad.test_runtime
          tests.core.test_process
          tests.core.test_repository
          tests.services.test_doctor

  native-kicad:
    name: ${{ matrix.os }} native KiCad first board
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Install KiCad stable on macOS
        if: runner.os == 'macOS'
        run: |
          brew install --cask kicad
          echo "KICAD_CLI=/Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli" >> "$GITHUB_ENV"
      - name: Install KiCad stable on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install kicad --version=10.0.5 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "KiCad Chocolatey install failed" }
          $cli = Join-Path $env:ProgramFiles "KiCad\10.0\bin\kicad-cli.exe"
          if (-not (Test-Path -LiteralPath $cli)) { throw "kicad-cli.exe was not installed" }
          "KICAD_CLI=$cli" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: uv sync --frozen --extra dev
      - run: uv run pcbdraft setup --json
      - name: Generate and validate the native reference board
        shell: bash
        run: >-
          uv run pcbdraft generate
          "$(uv run python -c 'from importlib.resources import files; from pcbdraft.core.resources import data_path; print(data_path("benchmark", "acceptance_requirements.json"))')"
          "$RUNNER_TEMP/pcbdraft-first-board"
          --json
      - name: Validate the native reference board
        shell: bash
        run: >-
          uv run pcbdraft validate
          "$RUNNER_TEMP/pcbdraft-first-board"
          --timeout 180
          --json
