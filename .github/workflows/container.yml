name: PCBDraft container

on:
  pull_request:
    paths:
      - Dockerfile
      - compose.yaml
      - packaging/container/**
      - pyproject.toml
      - uv.lock
      - src/**
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build local acceptance image
        run: docker build --tag pcbdraft:check .
      - name: Verify bundled runtime
        run: docker run --rm --entrypoint pcbdraft pcbdraft:check doctor --json
      - name: Publish main and release images
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag pcbdraft:check "$image:${GITHUB_SHA}"
          docker push "$image:${GITHUB_SHA}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            docker tag pcbdraft:check "$image:${GITHUB_REF_NAME}"
            docker push "$image:${GITHUB_REF_NAME}"
          else
            docker tag pcbdraft:check "$image:latest"
            docker push "$image:latest"
          fi
